# Activated only by SPRING_PROFILES_ACTIVE=render.
server:
  port: ${PORT:10000}
  address: 0.0.0.0
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 50
      min-spare: 2
    max-connections: 512
spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
eureka:
  client:
    service-url:
      defaultZone: http://${DISCOVERY_HOSTPORT}/eureka/
  instance:
    prefer-ip-address: false
    hostname: ${SERVICE_HOSTNAME}
    instance-id: ${spring.application.name}:${random.uuid}
    non-secure-port: ${server.port}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
