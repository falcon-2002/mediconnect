server:
  port: ${SERVER_PORT:8082}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://127.0.0.1:3306/mediconnect_auth}
    username: ${AUTH_DB_USER:auth_app}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: ${SERVICE_IP:127.0.0.1}
security:
  jwt:
    issuer: ${JWT_ISSUER:mediconnect-auth}
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
management:
  endpoints:
    web:
      exposure:
        include: health,info
